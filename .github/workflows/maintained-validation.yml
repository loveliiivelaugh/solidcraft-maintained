name: Isolated SolidCraft validation
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full reviewed commit in loveliiivelaugh/solidcraft-maintained
        required: true
        type: string
      validation_scope:
        description: Full candidate or targeted unchanged-source comparison
        required: true
        default: security
        type: choice
        options: [security, baseline-model-cache, ci, tests, readiness-fast, readiness, macos-readiness]
permissions: {}
concurrency:
  group: solidcraft-isolated-validation-${{ inputs.validation_scope == 'macos-readiness' && 'macos' || 'linux' }}
  cancel-in-progress: false
jobs:
  validate:
    if: ${{ inputs.validation_scope != 'macos-readiness' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions: {}
    steps:
      - name: Fetch trusted harness
        env:
          HARNESS_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          sudo mkdir -p /opt/maintained-harness
          for script in prepare.py sandbox.sh task.sh; do
            curl --fail --location --retry 3 "https://raw.githubusercontent.com/loveliiivelaugh/solidcraft-maintained/$HARNESS_SHA/.maintained/validation/$script" -o "/tmp/$script"
            sudo install -m 0755 "/tmp/$script" "/opt/maintained-harness/$script"
          done
      - name: Provision disposable VM tools
        timeout-minutes: 10
        run: |
          set -euo pipefail
          # The Azure mirror throttled the previous attempt for 15 minutes before source execution.
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends --no-upgrade pkg-config libxkbcommon-dev libwayland-dev xvfb xauth mesa-vulkan-drivers libvulkan1
          sudo env RUSTUP_HOME=/opt/maintained-rustup CARGO_HOME=/opt/maintained-cargo /home/runner/.cargo/bin/rustup toolchain install 1.95.0 --no-self-update --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
          sudo env RUSTUP_HOME=/opt/maintained-rustup CARGO_HOME=/opt/maintained-cargo /home/runner/.cargo/bin/rustup toolchain install nightly --no-self-update --profile minimal --component miri,rust-src
          sudo mkdir -p /opt/maintained-cargo/bin
          sudo cp /home/runner/.cargo/bin/rustup /opt/maintained-cargo/bin/rustup
          for tool in cargo rustc rustdoc rustfmt cargo-fmt clippy-driver cargo-clippy cargo-miri; do sudo ln -sf rustup "/opt/maintained-cargo/bin/$tool"; done
          sudo useradd --system --home-dir /var/lib/solidcraft/home --shell /usr/sbin/nologin solidcraft-build
          sudo mkdir -p /var/lib/solidcraft/{home,cargo,runtime}
          sudo chmod 0700 /var/lib/solidcraft/runtime
      - name: Fetch pinned public source
        timeout-minutes: 5
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          sudo --preserve-env=SOURCE_SHA python3 /opt/maintained-harness/prepare.py
          sudo chown -R solidcraft-build:solidcraft-build /var/lib/solidcraft
      - name: Prefetch locked dependencies
        timeout-minutes: 10
        run: bash /opt/maintained-harness/sandbox.sh prefetch
      - name: Verify isolation boundary
        run: bash /opt/maintained-harness/sandbox.sh isolation
      - name: Matrix regression tests
        if: ${{ inputs.validation_scope != 'baseline-model-cache' && !cancelled() && success() }}
        run: |
          guard=$(cat /proc/sys/kernel/random/uuid)
          echo "::stop-commands::$guard"
          set +e; bash /opt/maintained-harness/sandbox.sh matrix; result=$?; set -e
          echo "::$guard::"
          exit "$result"
      - name: Miri aliasing regression
        if: ${{ inputs.validation_scope != 'baseline-model-cache' && !cancelled() && success() }}
        run: |
          guard=$(cat /proc/sys/kernel/random/uuid)
          echo "::stop-commands::$guard"
          set +e; bash /opt/maintained-harness/sandbox.sh miri; result=$?; set -e
          echo "::$guard::"
          exit "$result"
      - name: SolidCraft workspace build
        if: ${{ inputs.validation_scope == 'security' && !cancelled() && success() }}
        run: |
          guard=$(cat /proc/sys/kernel/random/uuid)
          echo "::stop-commands::$guard"
          set +e; bash /opt/maintained-harness/sandbox.sh build; result=$?; set -e
          echo "::$guard::"
          exit "$result"
      - name: SolidCraft workspace tests
        if: ${{ inputs.validation_scope == 'security' && !cancelled() && success() }}
        run: |
          guard=$(cat /proc/sys/kernel/random/uuid)
          echo "::stop-commands::$guard"
          set +e; bash /opt/maintained-harness/sandbox.sh test; result=$?; set -e
          echo "::$guard::"
          exit "$result"
      - name: Full repository CI gates
        if: ${{ (inputs.validation_scope == 'security' || inputs.validation_scope == 'ci') && !cancelled() && success() }}
        run: |
          guard=$(cat /proc/sys/kernel/random/uuid)
          echo "::stop-commands::$guard"
          set +e; bash /opt/maintained-harness/sandbox.sh ci; result=$?; set -e
          echo "::$guard::"
          exit "$result"
      - name: Baseline model-cache regression
        if: ${{ inputs.validation_scope == 'baseline-model-cache' && !cancelled() && success() }}
        run: |
          guard=$(cat /proc/sys/kernel/random/uuid)
          echo "::stop-commands::$guard"
          set +e; bash /opt/maintained-harness/sandbox.sh baseline-model-cache; result=$?; set -e
          echo "::$guard::"
          exit "$result"
      - name: Complete workspace test collection
        if: ${{ inputs.validation_scope == 'tests' && !cancelled() && success() }}
        run: |
          guard=$(cat /proc/sys/kernel/random/uuid)
          echo "::stop-commands::$guard"
          set +e; bash /opt/maintained-harness/sandbox.sh tests; result=$?; set -e
          echo "::$guard::"
          exit "$result"
      - name: Readiness fast gates and notice generation
        if: ${{ inputs.validation_scope == 'readiness-fast' && !cancelled() && success() }}
        run: |
          guard=$(cat /proc/sys/kernel/random/uuid)
          echo "::stop-commands::$guard"
          set +e; bash /opt/maintained-harness/sandbox.sh readiness-fast; result=$?; set -e
          echo "::$guard::"
          exit "$result"
      - name: Strict static checks
        if: ${{ inputs.validation_scope == 'readiness' && !cancelled() && success() }}
        run: |
          guard=$(cat /proc/sys/kernel/random/uuid)
          echo "::stop-commands::$guard"
          set +e; bash /opt/maintained-harness/sandbox.sh static; result=$?; set -e
          echo "::$guard::"
          exit "$result"
      - name: Compile workspace test binaries
        if: ${{ inputs.validation_scope == 'readiness' && !cancelled() && success() }}
        run: |
          guard=$(cat /proc/sys/kernel/random/uuid)
          echo "::stop-commands::$guard"
          set +e; bash /opt/maintained-harness/sandbox.sh compile-tests; result=$?; set -e
          echo "::$guard::"
          exit "$result"
      - name: Bounded workspace and documentation tests
        if: ${{ inputs.validation_scope == 'readiness' && !cancelled() && success() }}
        run: |
          guard=$(cat /proc/sys/kernel/random/uuid)
          echo "::stop-commands::$guard"
          set +e; bash /opt/maintained-harness/sandbox.sh bounded-tests; result=$?; set -e
          echo "::$guard::"
          exit "$result"
      - name: Wasm compatibility checks
        if: ${{ inputs.validation_scope == 'readiness' && !cancelled() && success() }}
        run: |
          guard=$(cat /proc/sys/kernel/random/uuid)
          echo "::stop-commands::$guard"
          set +e; bash /opt/maintained-harness/sandbox.sh wasm; result=$?; set -e
          echo "::$guard::"
          exit "$result"
      - name: Browser offline smoke
        if: ${{ inputs.validation_scope == 'readiness' && !cancelled() && success() }}
        run: |
          guard=$(cat /proc/sys/kernel/random/uuid)
          echo "::stop-commands::$guard"
          set +e; bash /opt/maintained-harness/sandbox.sh browser; result=$?; set -e
          echo "::$guard::"
          exit "$result"
      - name: Desktop and CLI build smoke
        if: ${{ inputs.validation_scope == 'readiness' && !cancelled() && success() }}
        run: |
          guard=$(cat /proc/sys/kernel/random/uuid)
          echo "::stop-commands::$guard"
          set +e; bash /opt/maintained-harness/sandbox.sh desktop-smoke; result=$?; set -e
          echo "::$guard::"
          exit "$result"
  macos:
    if: ${{ inputs.validation_scope == 'macos-readiness' }}
    runs-on: macos-14
    timeout-minutes: 60
    permissions: {}
    steps:
      - name: Fetch trusted macOS harness
        env:
          HARNESS_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          sudo mkdir -p /opt/maintained-harness
          for script in prepare.py macos.sh; do
            curl --fail --location --retry 3 "https://raw.githubusercontent.com/loveliiivelaugh/solidcraft-maintained/$HARNESS_SHA/.maintained/validation/$script" -o "/tmp/$script"
            sudo install -m 0755 "/tmp/$script" "/opt/maintained-harness/$script"
          done
      - name: Provision macOS tools and isolated UID
        timeout-minutes: 10
        run: bash /opt/maintained-harness/macos.sh provision
      - name: Fetch pinned macOS source
        timeout-minutes: 5
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          sudo --preserve-env=SOURCE_SHA python3 /opt/maintained-harness/prepare.py
          sudo chown -R solidcraft-build:staff /var/lib/solidcraft
      - name: Prefetch locked macOS dependencies
        timeout-minutes: 10
        run: bash /opt/maintained-harness/macos.sh prefetch
      - name: Verify macOS isolation boundary
        run: bash /opt/maintained-harness/macos.sh isolation
      - name: Apple Silicon build and CLI smoke
        run: |
          guard=$(uuidgen)
          echo "::stop-commands::$guard"
          set +e; bash /opt/maintained-harness/macos.sh build; result=$?; set -e
          echo "::$guard::"
          exit "$result"
      - name: Package public native build
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/maintained-native
          for binary in solidcraft solidcraft-cli; do
            cp "/var/lib/solidcraft/source/target/aarch64-apple-darwin/ci/$binary" /tmp/maintained-native/
          done
          cp /var/lib/solidcraft/source/THIRD-PARTY-LICENSES.txt /var/lib/solidcraft/source/LICENSE-MIT /var/lib/solidcraft/source/LICENSE-APACHE /var/lib/solidcraft/source/NOTICE /tmp/maintained-native/
          printf '%s\n' "$SOURCE_SHA" > /tmp/maintained-native/SOURCE_COMMIT
          cd /tmp/maintained-native
          shasum -a 256 solidcraft solidcraft-cli THIRD-PARTY-LICENSES.txt > SHA256SUMS
          tar -czf /tmp/solidcraft-macos-arm64.tar.gz solidcraft solidcraft-cli THIRD-PARTY-LICENSES.txt LICENSE-MIT LICENSE-APACHE NOTICE SOURCE_COMMIT SHA256SUMS
      - name: Upload reviewed native build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: solidcraft-macos-arm64
          path: /tmp/solidcraft-macos-arm64.tar.gz
          compression-level: 0
          retention-days: 7
